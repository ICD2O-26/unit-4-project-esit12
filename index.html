<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ray Tracing Comparison Slider</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    margin: 0;
    color: #222;
}

header {
    text-align: center;
    padding: 20px;
    background: white;
    border-bottom: 1px solid #ddd;
}

section {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* ===== Slider ===== */

.slider-container {
    position: relative;
    max-width: 600px;
    margin: 30px auto;
    overflow: hidden;
    border-radius: 12px;
    user-select: none;
}

.slider-container img {
    width: 100%;
    display: block;
}

/* bottom image (RTX OFF) */
.base-img {
    position: relative;
}

/* top image (RTX ON) clipped */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 50%;
    overflow: hidden;
}

.overlay img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
}

/* divider line */
.divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    cursor: ew-resize;
}

/* handle circle */
.handle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    border: 2px solid #333;
}

/* labels */
.label {
    position: absolute;
    top: 10px;
    padding: 5px 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    border-radius: 5px;
    font-size: 14px;
}

.label.left { left: 10px; }
.label.right { right: 10px; }

</style>
</head>

<body>

<header>
<h1>Ray Tracing</h1>
<p>Drag to compare RTX OFF vs RTX ON</p>
</header>

<section>

<div class="slider-container" id="slider">

    <!-- RTX OFF (base) -->
    <img class="base-img" src="ray-trace-off.png">

    <!-- RTX ON (overlay) -->
    <div class="overlay" id="overlay">
        <img src="ray-trace-on.png">
    </div>

    <!-- divider -->
    <div class="divider" id="divider">
        <div class="handle"></div>
    </div>

    <span class="label left">RTX OFF</span>
    <span class="label right">RTX ON</span>

</div>

</section>

<script>
const slider = document.getElementById("slider");
const overlay = document.getElementById("overlay");
const divider = document.getElementById("divider");

let isDragging = false;

function setPosition(x) {
    const rect = slider.getBoundingClientRect();
    let percent = (x - rect.left) / rect.width;

    // clamp 0–1
    percent = Math.max(0, Math.min(1, percent));

    overlay.style.width = (percent * 100) + "%";
    divider.style.left = (percent * 100) + "%";
}

// start dragging
divider.addEventListener("pointerdown", () => {
    isDragging = true;
});

// drag anywhere on image (like real demos)
slider.addEventListener("pointerdown", (e) => {
    isDragging = true;
    setPosition(e.clientX);
});

// move
window.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    setPosition(e.clientX);
});

// stop
window.addEventListener("pointerup", () => {
    isDragging = false;
});
</script>

</body>
</html>
